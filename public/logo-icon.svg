<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3454D1" />
      <stop offset="55%" stop-color="#169ED9" />
      <stop offset="100%" stop-color="#15C8B8" />
    </linearGradient>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.58" />
    </linearGradient>
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.52" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.30" />
    </linearGradient>
    <filter id="cubeShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.6" flood-color="#0D1633" flood-opacity="0.38" />
    </filter>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="18" fill="url(#bg)" />

  <g filter="url(#cubeShadow)">
    <!-- isometric 3D cube -->
    <polygon points="32,13 51,26 32,39 13,26" fill="url(#topGrad)" />
    <polygon points="13,26 32,39 32,55 13,42" fill="url(#leftGrad)" />
    <polygon points="51,26 32,39 32,55 51,42" fill="url(#rightGrad)" />

    <!-- bright top edges -->
    <polyline points="13,26 32,13 51,26" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round" />
    <!-- soft bottom edges -->
    <polyline points="13,26 32,39 51,26" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="0.9" stroke-linejoin="round" />
    <polyline points="13,26 13,42 32,55 51,42 51,26" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="0.9" stroke-linejoin="round" />

    <!-- crisp vertical edges -->
    <line x1="32" y1="39" x2="32" y2="55" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1" />

    <!-- glossy top highlight -->
    <polygon points="32,15.5 45,23 32,30.5 19,23" fill="#ffffff" fill-opacity="0.25" />
  </g>

  <!-- forge sparkle -->
  <path d="M47,8 L49,12.5 L53.5,14.5 L49,16.5 L47,21 L45,16.5 L40.5,14.5 L45,12.5 Z"
        fill="#ffffff" fill-opacity="0.92" />
</svg>
